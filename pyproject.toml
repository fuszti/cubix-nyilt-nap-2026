[project]
name = "fajl-agent-demo"
version = "0.1.0"
description = "Fájlfeltöltés AI agentnek: kontextus, RAG és sandbox (Cubix nyílt nap, példakód)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastembed>=0.9.1",
    "fpdf2>=2.9.0",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docling = [
    "docling>=2.152.0",
    "pdfplumber>=0.11.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fajl_agent"]
